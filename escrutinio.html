<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0077cc" />
  <title>Escrutinio</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #333333;
      --muted: #6b7785;
      --line: #e5eaf0;
      --primary: #0077cc;
      --primary-dark: #005fa3;
      --accent: #ffb703;
      --ok: #22a06b;
      --shadow: 0 10px 30px rgba(0, 60, 120, 0.10);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1722;
        --card: #182233;
        --text: #eef3f9;
        --muted: #9db0c4;
        --line: #26344a;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
    }

    /* Monedas / símbolos flotando de fondo */
    .bg-symbols { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .bg-symbols span {
      position: absolute;
      bottom: -60px;
      font-weight: 800;
      color: var(--primary);
      opacity: 0.07;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp { to { transform: translateY(-120vh) rotate(25deg); } }

    .container {
      position: relative;
      z-index: 1;
      max-width: 600px;
      width: 100%;
      margin: 24px 16px;
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* Cabecera */
    .hero {
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      padding: 26px 24px 22px;
      color: #fff;
      text-align: center;
      background: linear-gradient(135deg, #0077cc, #00a6d6, #1f5fbf);
      background-size: 220% 220%;
      animation: shimmer 10s ease infinite, rise .7s ease both;
      box-shadow: var(--shadow);
    }
    @keyframes shimmer { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    .hero::after {
      content: "";
      position: absolute;
      right: -40px; top: -40px;
      width: 160px; height: 160px;
      border-radius: 50%;
      background: rgba(255,255,255,.10);
    }
    .coin {
      display: inline-block;
      font-size: 42px;
      animation: spin 3.2s ease-in-out infinite;
    }
    @keyframes spin {
      0%, 100% { transform: rotateY(0) translateY(0); }
      50% { transform: rotateY(360deg) translateY(-8px); }
    }
    .hero h1 { margin: 6px 0 4px; font-size: 28px; letter-spacing: .4px; }
    .hero p { margin: 0; font-size: 14px; opacity: .92; }

    /* Resumen */
    .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
    .summary div {
      background: rgba(255,255,255,.18);
      backdrop-filter: blur(4px);
      border-radius: 12px;
      padding: 10px 6px;
    }
    .summary strong { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
    .summary small { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; opacity: .88; }

    /* Lista de premios */
    .list { display: grid; gap: 12px; margin-top: 18px; }
    .row {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: 70px 1fr auto; /* Ampliado para acomodar "15 aciertos" */
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      background: var(--card);
      border-radius: 14px;
      box-shadow: var(--shadow);
      border-left: 5px solid var(--primary);
      opacity: 0;
      animation: rise .55s ease forwards;
      transition: transform .18s ease;
    }
    .row:hover { transform: translateY(-3px); }
    .row:active { transform: scale(.985); }
    .row.top { border-left-color: var(--accent); }
    .row.top .badge { background: linear-gradient(135deg, #ffb703, #ff8c00); color: #fff; }
    .row.empty { opacity: .0; border-left-color: var(--line); }
    .row.empty.in { opacity: .7; }

    .badge {
      width: 70px; height: 52px;
      display: grid; place-items: center;
      border-radius: 14px;
      background: rgba(0,119,204,.10);
      color: var(--primary);
      font-weight: 800;
      font-size: 14px;
      line-height: 1.2;
      text-align: center;
      padding: 0 4px;
    }

    .info b { display: block; font-size: 16px; }
    .info span { font-size: 13px; color: var(--muted); }
    .bar { height: 5px; border-radius: 4px; background: var(--line); margin-top: 8px; overflow: hidden; }
    .bar i {
      display: block; height: 100%; width: 0;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--primary), #00a6d6);
      transition: width 1.1s cubic-bezier(.2,.8,.2,1);
    }
    .row.top .bar i { background: linear-gradient(90deg, #ffb703, #ff8c00); }

    .prize { text-align: right; font-weight: 800; font-size: 18px; color: var(--ok); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .prize.zero { color: var(--muted); font-weight: 600; font-size: 14px; }

    /* Esqueleto de carga */
    .skeleton { height: 82px; border-radius: 14px; background: linear-gradient(90deg, var(--card) 25%, var(--line) 50%, var(--card) 75%); background-size: 200% 100%; animation: sk 1.3s linear infinite; box-shadow: var(--shadow); }
    @keyframes sk { to { background-position: -200% 0; } }

    .msg { text-align: center; padding: 26px 16px; background: var(--card); border-radius: 14px; box-shadow: var(--shadow); color: var(--muted); }
    .msg button {
      margin-top: 12px; padding: 10px 18px; border: none; border-radius: 8px;
      background: var(--primary); color: #fff; font-size: 15px; cursor: pointer;
    }
    .msg button:hover { background: var(--primary-dark); }

    /* Botón volver */
    a.back-link {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 22px;
      text-decoration: none;
      background: var(--primary);
      color: #fff !important;
      padding: 13px 15px;
      border-radius: 12px;
      font-size: 16px;
      box-shadow: var(--shadow);
      transition: transform .18s, background .2s;
    }
    a.back-link:hover { background: var(--primary-dark); transform: translateY(-2px); }
    a.back-link:active { transform: scale(.98); }
    a.back-link .arrow { transition: transform .2s; }
    a.back-link:hover .arrow { transform: translateX(-4px); }

    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 380px) {
      .row { grid-template-columns: 60px 1fr auto; gap: 10px; padding: 12px; }
      .badge { width: 60px; height: 46px; font-size: 12px; }
      .prize { font-size: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
      .row { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="bg-symbols" id="bgSymbols" aria-hidden="true"></div>

  <div class="container">
    <header class="hero">
      <div class="coin" aria-hidden="true">💰</div>
      <h1>Escrutinio de Premios</h1>
      <p id="subtitulo">Cargando el reparto…</p>
      <div class="summary">
        <div><strong id="totalPremios">–</strong><small>Total repartido</small></div>
        <div><strong id="totalAcertantes">–</strong><small>Acertantes</small></div>
      </div>
    </header>

    <main class="list" id="lista" aria-live="polite">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </main>

    <a class="back-link" href="index.html"><span class="arrow">←</span> Volver a inicio</a>
  </div>

  <script>
    const API_URL = "/api";

    /* ---- Símbolos flotantes de fondo ---- */
    (function () {
      var box = document.getElementById('bgSymbols');
      var syms = ['€', '1', 'X', '2'];
      for (var i = 0; i < 14; i++) {
        var s = document.createElement('span');
        s.textContent = syms[i % 4];
        s.style.left = Math.random() * 100 + '%';
        s.style.fontSize = (24 + Math.random() * 46) + 'px';
        s.style.animationDuration = (14 + Math.random() * 18) + 's';
        s.style.animationDelay = (-Math.random() * 20) + 's';
        box.appendChild(s);
      }
    })();

    const fmt = n => n.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    /* Animación de contador numérico */
    function contar(el, hasta, formato, dur) {
      dur = dur || 1100;
      var ini = performance.now();
      function paso(t) {
        var p = Math.min((t - ini) / dur, 1);
        var e = 1 - Math.pow(1 - p, 3);
        el.textContent = formato(hasta * e);
        if (p < 1) requestAnimationFrame(paso);
      }
      requestAnimationFrame(paso);
    }

    function mostrarError() {
      document.getElementById("lista").innerHTML =
        '<div class="msg">No se ha podido cargar el escrutinio 😕<br>' +
        '<button type="button" id="reintentar">Reintentar</button></div>';
      document.getElementById("subtitulo").textContent = "Algo ha fallado";
      document.getElementById("reintentar").addEventListener("click", cargarEscrutinio);
    }

    async function cargarEscrutinio() {
      var lista = document.getElementById("lista");
      lista.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
      document.getElementById("subtitulo").textContent = "Cargando el reparto…";

      try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const { escrutinio } = await res.json(); // el JSON debe tener esta propiedad

        // Ignoramos encabezados y procesamos solo datos
        const filas = escrutinio.slice(1).map(function (f) {
          return { aciertos: f[0], acertantes: parseInt(f[1], 10) || 0, premio: parseFloat(f[2]) || 0 };
        });

        if (!filas.length) {
          lista.innerHTML = '<div class="msg">Todavía no hay escrutinio disponible ⏳</div>';
          document.getElementById("subtitulo").textContent = "Vuelve en cuanto se publique";
          document.getElementById("totalPremios").textContent = "–";
          document.getElementById("totalAcertantes").textContent = "–";
          return;
        }

        lista.innerHTML = "";
        const maxPremio = Math.max.apply(null, filas.map(function (f) { return f.premio; })) || 1;
        const totalRep = filas.reduce(function (s, f) { return s + f.premio * f.acertantes; }, 0);
        const totalAc = filas.reduce(function (s, f) { return s + f.acertantes; }, 0);

        filas.forEach(function (f, i) {
          const esTop = f.premio === maxPremio && f.premio > 0;
          const desierto = f.acertantes === 0;
          
          // Extraemos únicamente el número del texto enviado por la API (ej: "1ª (14 Aciertos)" -> 14)
          const numMatch = String(f.aciertos).match(/\d+/);
          const numAciertos = numMatch ? numMatch[0] : f.aciertos;
          const textoBadge = numAciertos + ' aciertos';

          const row = document.createElement("div");
          row.className = "row" + (esTop ? " top" : "") + (desierto ? " empty" : "");
          row.style.animationDelay = (i * 0.07) + "s";
          row.innerHTML =
            '<div class="badge"><div>' + textoBadge + '</div></div>' +
            '<div class="info"><b>' + f.acertantes + (f.acertantes === 1 ? ' acertante' : ' acertantes') + '</b>' +
            '<span>' + (desierto ? 'Premio desierto' : (esTop ? '🏆 Premio mayor' : 'Premio por acertante')) + '</span>' +
            '<div class="bar"><i></i></div></div>' +
            '<div class="prize' + (f.premio === 0 ? ' zero' : '') + '"></div>';
          lista.appendChild(row);
          if (desierto) setTimeout(function () { row.classList.add("in"); }, i * 70 + 560);

          const prizeEl = row.querySelector(".prize");
          if (f.premio === 0) {
            prizeEl.textContent = "—";
          } else {
            setTimeout(function () {
              contar(prizeEl, f.premio, function (v) { return fmt(v) + " €"; });
            }, i * 70 + 150);
          }
          setTimeout(function () {
            row.querySelector(".bar i").style.width = Math.max((f.premio / maxPremio) * 100, f.premio > 0 ? 6 : 0) + "%";
          }, i * 70 + 250);
        });

        document.getElementById("subtitulo").textContent = filas.length + " categorías de premio";
        contar(document.getElementById("totalPremios"), totalRep, function (v) { return fmt(v) + " €"; });
        contar(document.getElementById("totalAcertantes"), totalAc, function (v) { return Math.round(v); });
      } catch (error) {
        console.error("Error cargando el escrutinio:", error);
        mostrarError();
      }
    }

    cargarEscrutinio();
  </script>
</body>
</html>
