<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0077cc" />
  <title>Escrutinio</title>
<style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #333333;
      --muted: #6b7785;
      --line: #e5eaf0;
      --primary: #0077cc;
      --primary-dark: #005fa3;
      --accent: #ffb703;
      --ok: #22a06b;
      --shadow: 0 10px 30px rgba(0, 60, 120, 0.10);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
    }

    /* Monedas / símbolos flotando de fondo */
    .bg-symbols { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .bg-symbols span {
      position: absolute;
      bottom: -60px;
      font-weight: 800;
      color: var(--primary);
      opacity: 0.07;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp { to { transform: translateY(-120vh) rotate(25deg); } }

    .container {
      position: relative;
      z-index: 1;
      max-width: 600px;
      width: 100%;
      margin: 24px 16px;
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* Cabecera */
    .hero {
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      padding: 26px 24px 22px;
      color: #fff;
      text-align: center;
      background: linear-gradient(135deg, #0077cc, #00a6d6, #1f5fbf);
      background-size: 220% 220%;
      animation: shimmer 10s ease infinite, rise .7s ease both;
      box-shadow: var(--shadow);
    }
    @keyframes shimmer { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    .hero::after {
      content: "";
      position: absolute;
      right: -40px; top: -40px;
      width: 160px; height: 160px;
      border-radius: 50%;
      background: rgba(255,255,255,.10);
    }
    .coin {
      display: inline-block;
      font-size: 42px;
      animation: spin 3.2s ease-in-out infinite;
    }
    @keyframes spin {
      0%, 100% { transform: rotateY(0) translateY(0); }
      50% { transform: rotateY(360deg) translateY(-8px); }
    }
    .hero h1 { margin: 6px 0 4px; font-size: 28px; letter-spacing: .4px; }
    .hero p { margin: 0; font-size: 14px; opacity: .92; }

    /* Cuadro naranja resumen */
    .summary { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 16px; }
    .summary div {
      background: rgba(255,255,255,.18);
      backdrop-filter: blur(4px);
      border-radius: 12px;
      padding: 10px 6px;
    }
    .summary strong { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
    .summary small { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; opacity: .88; }
    .summary div.highlight {
      background: linear-gradient(135deg, #ffd23f, #ff9f1c, #ff7b00);
      color: #3a2200;
      padding: 16px 12px;
      box-shadow: 0 0 0 2px rgba(255,255,255,.55), 0 8px 24px rgba(255,140,0,.45);
      animation: glow 2.4s ease-in-out infinite;
    }
    .summary div.highlight .trophy { display: block; font-size: 30px; line-height: 1; margin-bottom: 4px; }
    .summary div.highlight strong { font-size: 32px; letter-spacing: .3px; }
    .summary div.highlight small { opacity: 1; font-weight: 700; display: block; margin-top: 6px; }
    @keyframes glow { 0%,100% { box-shadow: 0 0 0 2px rgba(255,255,255,.55), 0 8px 24px rgba(255,140,0,.45); } 50% { box-shadow: 0 0 0 4px rgba(255,255,255,.8), 0 8px 34px rgba(255,170,0,.8); } }

    /* Tarjetas de jornada dentro de los desplegables */
    .list { display: grid; gap: 12px; margin-top: 18px; }
    .row {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: 56px 1fr auto;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      background: var(--card);
      border-radius: 14px;
      box-shadow: var(--shadow);
      border-left: 5px solid var(--primary);
      opacity: 0;
      animation: rise .55s ease forwards;
      transition: transform .18s ease;
    }
    .row:hover { transform: translateY(-3px); }
    .row.top { border-left-color: var(--accent); }
    .row.top .badge { background: linear-gradient(135deg, #ffb703, #ff8c00); color: #fff; }

    .badge {
      width: 52px; height: 52px;
      display: grid; place-items: center;
      border-radius: 14px;
      background: rgba(0,119,204,.10);
      color: var(--primary);
      font-weight: 800;
      font-size: 20px;
      line-height: 1;
      text-align: center;
    }
    .badge small { display: block; font-size: 9px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; opacity: .8; margin-top: 2px; }

    .info .cat { display: block; font-size: 15px; font-weight: 700; margin-bottom: 7px; }
    .info .cat em { font-style: normal; font-weight: 600; font-size: 12px; color: var(--muted); margin-left: 6px; }

    .bar { height: 5px; border-radius: 4px; background: var(--line); overflow: hidden; }
    .bar i {
      display: block; height: 100%; width: 0;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--primary), #00a6d6);
      transition: width 1.1s cubic-bezier(.2,.8,.2,1);
    }
    .row.top .bar i { background: linear-gradient(90deg, #ffb703, #ff8c00); }

    .prize { text-align: right; font-weight: 800; font-size: 18px; color: var(--ok); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .prize.zero { color: var(--muted); font-weight: 600; font-size: 14px; }

    .hist h2 { margin: 28px 4px 0; font-size: 14px; text-transform: uppercase; letter-spacing: .9px; color: var(--primary); }

    details.temp { margin-top: 14px; background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: 0 14px; }
    details.temp > summary { cursor: pointer; list-style: none; padding: 14px 2px; display: flex; align-items: center; gap: 10px; font-weight: 800; color: var(--primary); }
    details.temp > summary::-webkit-details-marker { display: none; }
    details.temp > summary::after { content: "▾"; transition: transform .2s; }
    details.temp[open] > summary::after { transform: rotate(180deg); }
    .temp-tot { margin-left: auto; font-size: 13px; color: var(--muted); font-weight: 600; }
    details.temp .list { margin: 0 0 14px; }
    .temp-vacia { padding: 4px 2px 16px; color: var(--muted); font-size: 14px; }
    
    .total-final { margin-top: 22px; text-align: center; padding: 18px 12px; border-radius: 14px; color: #fff; background: linear-gradient(135deg, #0077cc, #1f5fbf); box-shadow: var(--shadow); }
    .total-final small { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .7px; opacity: .9; }
    .total-final strong { display: block; font-size: 30px; margin: 4px 0; font-variant-numeric: tabular-nums; }
    .total-final span { font-size: 13px; opacity: .9; }

    .skeleton { height: 82px; border-radius: 14px; background: linear-gradient(90deg, var(--card) 25%, var(--line) 50%, var(--card) 75%); background-size: 200% 100%; animation: sk 1.3s linear infinite; box-shadow: var(--shadow); margin-top: 14px; }
    @keyframes sk { to { background-position: -200% 0; } }

    .msg { text-align: center; padding: 26px 16px; background: var(--card); border-radius: 14px; box-shadow: var(--shadow); color: var(--muted); margin-top: 18px; }
    .msg button {
      margin-top: 12px; padding: 10px 18px; border: none; border-radius: 8px;
      background: var(--primary); color: #fff; font-size: 15px; cursor: pointer;
    }
    .msg button:hover { background: var(--primary-dark); }

    a.back-link {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 22px;
      text-decoration: none;
      background: var(--primary);
      color: #fff !important;
      padding: 13px 15px;
      border-radius: 12px;
      font-size: 16px;
      box-shadow: var(--shadow);
      transition: transform .18s, background .2s;
    }
    a.back-link:hover { background: var(--primary-dark); transform: translateY(-2px); }
    a.back-link:active { transform: scale(.98); }
    a.back-link .arrow { transition: transform .2s; }
    a.back-link:hover .arrow { transform: translateX(-4px); }

    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 380px) {
      .row { grid-template-columns: 48px 1fr auto; gap: 10px; padding: 12px; }
      .badge { width: 46px; height: 46px; font-size: 18px; }
      .prize { font-size: 16px; }
    }
  </style>
</head>
<body>
  <script src="nav.js"></script>
  <div class="bg-symbols" id="bgSymbols" aria-hidden="true"></div>

  <div class="container">
    <header class="hero">
      <div class="coin" aria-hidden="true">💰</div>
      <h1>Escrutinio de Premios</h1>
      <p id="subtitulo">Histórico de cobros por temporada</p>
      <div class="summary">
        <div class="highlight">
          <span class="trophy" aria-hidden="true">🎯</span>
          <strong id="jornadaImporte">–</strong>
          <small id="jornadaLabel">Cobrado en esta jornada</small>
        </div>
      </div>
    </header>

    <div id="cargando">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>

    <section class="hist" id="hist" style="display:none">
      <h2>📒 Histórico por temporadas</h2>
      <div id="temporadas"></div>
    </section>

    <div class="total-final" id="totalFinal" style="display:none">
      <small>Total acumulado · todas las temporadas</small>
      <strong id="totalAcumulado">–</strong>
      <span id="totalDetalle"></span>
    </div>

    <a class="back-link" href="index.html"><span class="arrow">←</span> Volver a inicio</a>
  </div>

  <script>
    const API_URL = "/api";

    (function () {
      var box = document.getElementById('bgSymbols');
      var syms = ['€', '1', 'X', '2'];
      for (var i = 0; i < 14; i++) {
        var s = document.createElement('span');
        s.textContent = syms[i % 4];
        s.style.left = Math.random() * 100 + '%';
        s.style.fontSize = (24 + Math.random() * 46) + 'px';
        s.style.animationDuration = (14 + Math.random() * 18) + 's';
        s.style.animationDelay = (-Math.random() * 20) + 's';
        box.appendChild(s);
      }
    })();

    const fmt = n => n.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    function contar(el, hasta, formato, dur) {
      dur = dur || 1100;
      var ini = performance.now();
      function paso(t) {
        var p = Math.min((t - ini) / dur, 1);
        var e = 1 - Math.pow(1 - p, 3);
        el.textContent = formato(hasta * e);
        if (p < 1) requestAnimationFrame(paso);
      }
      requestAnimationFrame(paso);
    }

    var TEMP_DEFECTO = ["2025-2026", "2026-2027"], TEMP_ACTIVA = "2026-2027";

   function pintarResumen(ult) {
      var imp = ult ? ult.importe : 0;
      var impEl = document.getElementById("jornadaImporte");
      if (imp > 0) contar(impEl, imp, function (v) { return fmt(v) + " €"; }); else impEl.textContent = "0,00 €";
      
      var textJornada = ult && ult.j ? ult.j : "esta jornada";

      document.getElementById("jornadaLabel").textContent = "Cobrado en " + textJornada;
      
      var chip = document.getElementById("jornadaAciertos");
      if (chip) chip.style.display = "none";
    }

    function tarjetaJornada(h, max, i, esTop) {
      var row = document.createElement("div");
      row.className = "row" + (esTop ? " top" : "");
      row.style.animationDelay = (i * 0.06) + "s";
      var badge = document.createElement("div"); badge.className = "badge";
      var bi = document.createElement("div"); bi.textContent = h.aciertos;
      var sm = document.createElement("small"); sm.textContent = h.aciertos === 1 ? "acierto" : "aciertos";
      bi.appendChild(sm); badge.appendChild(bi);
      var info = document.createElement("div"); info.className = "info";
      var cat = document.createElement("span"); cat.className = "cat"; cat.textContent = h.j;
      if (esTop) { var em = document.createElement("em"); em.textContent = "🏆 Mejor jornada"; cat.appendChild(em); }
      var bar = document.createElement("div"); bar.className = "bar";
      var fill = document.createElement("i"); bar.appendChild(fill);
      info.appendChild(cat); info.appendChild(bar);
      var prize = document.createElement("div"); prize.className = "prize" + (h.importe === 0 ? " zero" : "");
      prize.textContent = h.importe === 0 ? "—" : fmt(h.importe) + " €";
      row.appendChild(badge); row.appendChild(info); row.appendChild(prize);
      setTimeout(function () { fill.style.width = Math.max((h.importe / max) * 100, h.importe > 0 ? 6 : 0) + "%"; }, i * 60 + 250);
      return row;
    }

    function pintarTemporadas(historial, temporadas, activa) {
      var sec = document.getElementById("hist"), cont = document.getElementById("temporadas");
      cont.innerHTML = "";
      sec.style.display = "";

      // Mostramos la temporada activa primero invirtiendo el orden
      var listaTemps = temporadas.slice().reverse();

      listaTemps.forEach(function (t) {
        var todas = historial.filter(function (h) { return h.temp === t; });
        var total = todas.reduce(function (s, h) { return s + h.importe; }, 0);
        
        var det = document.createElement("details");
        det.className = "temp";
        if (t === activa) det.open = true;

        var sum = document.createElement("summary");
        sum.textContent = "Temporada " + t + (t === activa ? " · activa" : "");
        var tt = document.createElement("span"); tt.className = "temp-tot";
        tt.textContent = todas.length + (todas.length === 1 ? " jornada" : " jornadas") + " · " + fmt(total) + " €";
        sum.appendChild(tt);
        det.appendChild(sum);

        if (!todas.length) {
          var v = document.createElement("div"); v.className = "temp-vacia";
          v.textContent = "Todavía no hay jornadas en esta temporada.";
          det.appendChild(v);
        } else {
          var max = Math.max.apply(null, todas.map(function (h) { return h.importe; })) || 1;
          var box = document.createElement("div"); box.className = "list";
          todas.slice().reverse().forEach(function (h, i) {
            box.appendChild(tarjetaJornada(h, max, i, h.importe === max && h.importe > 0));
          });
          det.appendChild(box);
        }
        cont.appendChild(det);
      });
    }

    function pintarTotal(historial) {
      var box = document.getElementById("totalFinal");
      if (!historial.length) { box.style.display = "none"; return; }
      box.style.display = "";
      var total = historial.reduce(function (s, h) { return s + h.importe; }, 0);
      contar(document.getElementById("totalAcumulado"), total, function (v) { return fmt(v) + " €"; });
      document.getElementById("totalDetalle").textContent = historial.length + (historial.length === 1 ? " jornada" : " jornadas") + " en total";
    }

    function pintarTodo(historial, temporadas, activa, mejorJ) {
      var deActiva = historial.filter(function (h) { return h.temp === activa; });
      var ultimaJornada = deActiva.length ? deActiva[deActiva.length - 1] : (historial.length ? historial[historial.length - 1] : null);
      
      pintarResumen(ultimaJornada, mejorJ);
      pintarTemporadas(historial, temporadas, activa);
      pintarTotal(historial);
    }

    function mostrarError() {
      document.getElementById("cargando").innerHTML =
        '<div class="msg">No se ha podido cargar el escrutinio 😕<br>' +
        '<button type="button" id="reintentar">Reintentar</button></div>';
      document.getElementById("reintentar").addEventListener("click", cargarEscrutinio);
    }

    async function cargarEscrutinio() {
      var cargando = document.getElementById("cargando");
      cargando.style.display = "";
      cargando.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';

      try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const datos = await res.json();
        
        const temporadas = Array.isArray(datos.temporadas) && datos.temporadas.length ? datos.temporadas : TEMP_DEFECTO;
        const activa = datos.temporadaActiva || TEMP_ACTIVA;
        const mejorJ = datos.mejorJugadorActual || null;
        const historial = (Array.isArray(datos.historial) ? datos.historial : []).map(function (h) {
          return { j: h.j, temp: h.temp || activa, aciertos: Number(h.aciertos) || 0, importe: Number(h.importe) || 0 };
        });

        cargando.style.display = "none";
        pintarTodo(historial, temporadas, activa, mejorJ);
      } catch (error) {
        console.error("Error cargando el escrutinio:", error);
        mostrarError();
      }
    }

    cargarEscrutinio();
  </script>
</body>
</html>
