<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pronósticos de la Jornada</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background-color: #e9eff5; margin: 0; padding: 20px; }
    .container { max-width: 1200px; margin: auto; background: #fff; padding: 25px; border-radius: 14px; box-shadow: 0 6px 22px rgba(0,51,102,0.12); }

    /* ---------- Cabecera ---------- */
    .portada { text-align: center; margin-bottom: 18px; }
    .portada h1 { margin: 0; color: #003366; text-transform: uppercase; letter-spacing: 1px; font-size: 1.7em; }
    .portada p { margin: 6px 0 0; color: #5b7fa6; font-size: 14px; }
    .barra { height: 5px; border-radius: 3px; margin: 14px auto 0; max-width: 260px; background: linear-gradient(90deg, #218838 0 33.3%, #eab000 33.3% 66.6%, #c82333 66.6% 100%); }

    .leyenda { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; margin: 16px 0 14px; font-size: 13px; color: #36597f; }
    .leyenda span { display: inline-flex; align-items: center; gap: 6px; }
    .leyenda .signo { width: 24px; height: 24px; font-size: 13px; }
    .consejo { text-align: center; color: #6c757d; font-size: 12px; margin: 0 0 10px; }

    /* ---------- Boleto (tabla) ---------- */
    .boleto { overflow-x: auto; border: 3px solid #003366; border-radius: 12px; background: #fff; -webkit-overflow-scrolling: touch; }
    table { border-collapse: separate; border-spacing: 0; width: 100%; }

    thead th { background: #003366; color: #fff; padding: 10px 6px; text-align: center; font-weight: 600; font-size: 13px; border-left: 1px solid #1a4a80; }
    thead th:first-child { border-left: 0; text-align: left; padding-left: 14px; text-transform: uppercase; letter-spacing: 1px; font-size: 12px; }
    thead th.jug { min-width: 74px; }
    .jug button { all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%; padding: 2px 0; border-radius: 8px; }
    .jug button:hover { background: rgba(255,255,255,.12); }
    .jug button:focus-visible { outline: 2px solid #ffd700; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: #0077cc; border: 2px solid #8dbdf0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; text-transform: uppercase; }
    .jug .nom { max-width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }

    td { padding: 7px 6px; text-align: center; border-top: 1px solid #dbe7f4; border-left: 1px solid #eef3f9; }
    tbody tr:nth-child(odd) td { background: #ffffff; }
    tbody tr:nth-child(even) td { background: #f2f8ff; }
    tbody tr:hover td { background: #dcecfd !important; }

    td.partido, th.partido { position: sticky; left: 0; z-index: 2; }
    td.partido { text-align: left; min-width: 190px; max-width: 260px; border-left: 0; border-right: 2px solid #b3d7ff; padding: 8px 12px; }
    thead th.partido { z-index: 3; }
    .pt { display: flex; align-items: center; gap: 10px; }
    .num { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 2px solid #0077cc; color: #0077cc; background: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; }
    .eq { flex: 1; min-width: 0; line-height: 1.25; font-size: 13px; font-weight: 600; color: #003366; }
    .eq span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .eq .vs { font-size: 10px; font-weight: normal; color: #7a97b8; letter-spacing: 1px; }
    .res { flex: none; font-size: 12px; font-weight: bold; color: #003366; background: #e3f2fd; border: 1px solid #b3d7ff; border-radius: 6px; padding: 2px 7px; }
    .res.pleno { background: #fff3cd; border-color: #ffe08a; color: #7a5b00; }

    /* ---------- Las apuestas ---------- */
    .signo { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 8px; font-weight: 800; font-size: 17px; color: #fff; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }
    .s1 { background: #218838; }
    .sX { background: #eab000; color: #2b2b2b; }
    .s2 { background: #c82333; }
    .vacio { color: #b9c7d8; font-size: 18px; }
    .marcador { display: inline-block; padding: 5px 9px; border-radius: 8px; background: #003366; color: #ffd700; font-weight: bold; font-size: 14px; letter-spacing: 1px; }

    /* Fila del pleno al 15 */
    tbody tr.pleno td { border-top: 3px double #d4a800; }
    tbody tr.pleno td.partido .num { border-color: #d4a800; color: #856404; background: #fff8e0; font-size: 11px; }

    /* Resaltar a un jugador al pulsar su nombre */
    .boleto.enfoque td.col, .boleto.enfoque th.jug { opacity: .35; transition: opacity .15s; }
    .boleto.enfoque td.col.sel, .boleto.enfoque th.jug.sel { opacity: 1; }
    .boleto.enfoque td.col.sel { background: #fff7cf !important; box-shadow: inset 2px 0 0 #ffd700, inset -2px 0 0 #ffd700; }
    .boleto.enfoque th.jug.sel { background: #0b5ea8; }

    .msg { text-align: center; padding: 30px; color: #555; }
    .btn-volver { display: inline-block; margin-top: 25px; background: #0077cc; color: white !important; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: bold; }
    .btn-volver:hover { background: #005fa3; }

    @media (max-width: 640px) {
      body { padding: 8px; } .container { padding: 14px; border-radius: 10px; }
      td.partido { min-width: 150px; padding: 6px 8px; } .eq { font-size: 12px; } .num { width: 24px; height: 24px; font-size: 12px; }
      .signo { width: 30px; height: 30px; font-size: 15px; } thead th.jug { min-width: 62px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="portada">
      <h1>Pronósticos de la Jornada</h1>
      <p id="resumen">Cargando apuestas...</p>
      <div class="barra"></div>
    </div>

    <div class="leyenda">
      <span><i class="signo s1">1</i> Gana el local</span>
      <span><i class="signo sX">X</i> Empate</span>
      <span><i class="signo s2">2</i> Gana el visitante</span>
    </div>
    <p class="consejo">Pulsa el nombre de un jugador para resaltar sus apuestas</p>

    <div class="boleto" id="boleto">
      <table id="tablaPronosticos">
        <thead><tr id="headerRow"></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <a href="index.html" class="btn-volver">⬅ Volver al Inicio</a>
  </div>

  <script>
    const API_URL = "/api";

    function el(tag, cls, txt) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (txt !== undefined) e.textContent = txt;
      return e;
    }
    const equipo = t => String(t == null ? "" : t).replace(/\s*\(.*$/, "").trim();   // quita "(M) (15º)"

    // Limpieza de fechas ISO por si acaso (igual que antes)
    function limpiar(v) {
      let val = (v === null || v === undefined) ? "" : v;
      if (val.toString().includes("T") && val.toString().includes("Z")) val = "";
      return val.toString().trim();
    }

    // Celda con la apuesta: 1 / X / 2 como cuadradito de color
    function celdaApuesta(valor, esPleno) {
      const td = el("td", "col");
      if (!valor) { td.appendChild(el("span", "vacio", "–")); return td; }
      const v = valor.toUpperCase();
      if (esPleno) { td.appendChild(el("span", "marcador", valor.replace(/\s/g, ""))); return td; }
      const cls = v === "1" ? "s1" : v === "X" ? "sX" : v === "2" ? "s2" : "";
      td.appendChild(el("span", cls ? "signo " + cls : "marcador", v));
      return td;
    }

    function celdaPartido(num, local, visitante, resultado, esPleno) {
      const td = el("td", "partido");
      const pt = el("div", "pt");
      pt.appendChild(el("div", "num", esPleno ? "15" : String(num)));
      const eq = el("div", "eq");
      eq.appendChild(el("span", "", esPleno ? "🔥 " + local : local));
      eq.appendChild(el("span", "vs", "VS"));
      eq.appendChild(el("span", "", visitante));
      eq.title = local + " – " + visitante;
      pt.appendChild(eq);
      if (resultado) pt.appendChild(el("div", "res" + (esPleno ? " pleno" : ""), resultado));
      td.appendChild(pt);
      return td;
    }

    async function cargar() {
      const tbody = document.querySelector("#tablaPronosticos tbody");
      try {
        const res = await fetch(API_URL, { cache: "no-store" });
        const data = await res.json();
        const filas = data.pronosticos;
        const partidos = data.partidos || [];
        if (!filas || filas.length < 2) {
          document.getElementById("resumen").textContent = "Todavía no hay apuestas";
          return;
        }

        // Jugadores = filas con nombre (la fila 0 es la cabecera)
        const jugadores = filas.slice(1).filter(f => f && f[0] !== null && f[0] !== undefined && String(f[0]).trim() !== "");
        document.getElementById("resumen").textContent = jugadores.length + (jugadores.length === 1 ? " jugador" : " jugadores") + " · 14 partidos + pleno al 15";

        // 1) Cabecera: "Partido" + un botón por jugador
        const header = document.getElementById("headerRow");
        header.innerHTML = "";
        header.appendChild(el("th", "partido", "Partido"));
        const boleto = document.getElementById("boleto");
        let seleccionado = -1;
        jugadores.forEach((f, j) => {
          const nombre = limpiar(f[0]);
          const th = el("th", "jug");
          const b = el("button");
          b.type = "button";
          b.title = "Resaltar a " + nombre;
          b.appendChild(el("div", "avatar", nombre.charAt(0) || "?"));
          b.appendChild(el("div", "nom", nombre));
          b.addEventListener("click", () => {
            seleccionado = (seleccionado === j) ? -1 : j;
            boleto.classList.toggle("enfoque", seleccionado !== -1);
            document.querySelectorAll("#tablaPronosticos .jug, #tablaPronosticos td.col").forEach(c => {
              c.classList.toggle("sel", Number(c.getAttribute("data-j")) === seleccionado);
            });
          });
          th.setAttribute("data-j", String(j));
          th.appendChild(b);
          header.appendChild(th);
        });

        // 2) Cuerpo: una fila por partido (1-14) y la del pleno al 15
        tbody.innerHTML = "";
        for (let i = 1; i <= 15; i++) {
          const p = partidos[i];
          const esPleno = i === 15;
          const local = p ? equipo(p[1]) : "Partido " + i;
          const visitante = p ? equipo(p[2]) : "";
          const r = p && p[3] !== null && p[3] !== undefined ? String(p[3]).trim().replace(/\s/g, "") : "";
          const resultado = (r && r !== "-") ? r : "";

          const tr = el("tr", esPleno ? "pleno" : "");
          tr.appendChild(celdaPartido(i, local, visitante, resultado, esPleno));
          jugadores.forEach((f, j) => {
            const td = celdaApuesta(limpiar(f[i]), esPleno);
            td.setAttribute("data-j", String(j));
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        }
      } catch (e) {
        console.error("Error al cargar la tabla:", e);
        document.getElementById("resumen").textContent = "";
        document.getElementById("boleto").replaceChildren(el("div", "msg", "Error de conexión. Revisa la consola."));
      }
    }
    cargar();
  </script>
</body>
</html>
