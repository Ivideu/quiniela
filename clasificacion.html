<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clasificación - Quiniela</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; align-items: flex-start; }
    .container { max-width: 600px; width: 100%; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h1 { text-align: center; margin-bottom: 8px; color: #333; }
    .sub { text-align: center; color: #6c757d; font-size: 14px; margin: 0 0 22px; }

    /* ---------- Un desplegable por jugador ---------- */
    .jugador { border: 2px solid #0077cc; border-radius: 10px; margin-bottom: 10px; overflow: hidden; background: #fff; }
    .jugador:nth-child(even) > summary { background-color: #b1d4fd; }   /* cebra, como antes */
    .jugador > summary {
      list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px;
      padding: 14px 16px; background: #fff; font-weight: bold; color: #003366; user-select: none;
    }
    .jugador > summary::-webkit-details-marker { display: none; }
    .jugador > summary:hover { background-color: #8dbdf0 !important; transition: .1s; }
    .jugador > summary:focus-visible { outline: 3px solid #003366; outline-offset: -3px; }
    .flecha { transition: transform .2s; color: #0077cc; font-size: 14px; }
    .jugador[open] .flecha { transform: rotate(90deg); }
    .nombre { flex: 1; text-align: left; font-size: 1.05em; }
    .marcador { display: flex; gap: 16px; align-items: baseline; }
    .cifra { font-size: 1.25em; text-align: right; white-space: nowrap; }
    .cifra small { font-size: .55em; font-weight: normal; margin-left: 4px; text-transform: uppercase; letter-spacing: .5px; }
    .cifra.ac { color: #1e7e34; } .cifra.ac small { color: #4f8a5f; }
    .cifra.fa { color: #c82333; } .cifra.fa small { color: #b5707a; }
    .nombre { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .pendientes { text-align: center; margin: 0 0 16px; padding: 10px 14px; border-radius: 8px; background: #fff3cd; border: 1px solid #ffe08a; color: #7a5b00; font-weight: bold; font-size: 15px; }
    .pendientes.fin { background: #d4edda; border-color: #b7dfc2; color: #155724; }

    /* ---------- Boleto del jugador: 2 columnas ---------- */
    .boleto { border-top: 2px solid #0077cc; background: #fbfdff; }
    .boleto table { width: 100%; border-collapse: collapse; }
    .boleto th { background: #0077cc; color: #fff; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; padding: 8px; width: 50%; }
    .boleto td { text-align: center; padding: 0; border: 0; }
    .boleto tr.partido td { background: #eaf3fc; color: #36597f; font-size: 12px; font-weight: bold; padding: 6px 10px 5px; text-align: left; border-top: 1px solid #cfe2f7; }
    .boleto tr.partido td b { color: #0077cc; margin-right: 6px; }
    .celdas td { width: 50%; font-size: 20px; font-weight: bold; padding: 8px; border-left: 1px solid #dee2e6; }
    .celdas td:first-child { border-left: 0; }

    /* Verde = acertado · Rojo = fallado · Gris = todavía sin resultado */
    .celdas.ok td   { background: #d4edda; color: #155724; }
    .celdas.fail td { background: #f8d7da; color: #721c24; }
    .celdas.pend td { background: #fff; color: #6c757d; }

    .pleno-tit td { background: #fff3cd !important; color: #856404 !important; border-top: 2px solid #ffd700 !important; }
    .resumen { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; padding: 10px; font-size: 13px; font-weight: bold; background: #fff; border-top: 1px solid #dee2e6; }
    .resumen .v { color: #155724; } .resumen .r { color: #721c24; } .resumen .p { color: #6c757d; }
    .vacio { padding: 16px; text-align: center; color: #6c757d; font-size: 14px; }

    .leyenda { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin: 0 0 18px; font-size: 13px; color: #444; }
    .leyenda span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; border: 1px solid rgba(0,0,0,.15); }
    .leyenda .l-ok::before { background: #d4edda; } .leyenda .l-fail::before { background: #f8d7da; } .leyenda .l-pend::before { background: #fff; }

    .btn-volver { display: block; margin-top: 25px; text-decoration: none; background: #0077cc; color: white !important; padding: 12px; border-radius: 6px; text-align: center; font-weight: bold; }
    .btn-volver:hover { background: #005fa3; }
    .msg { text-align: center; color: #555; padding: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Clasificación de aciertos</h1>
    <p class="sub">Pulsa un nombre para ver su quiniela</p>
    <div class="leyenda"><span class="l-ok">Acertado</span><span class="l-fail">Fallado</span><span class="l-pend">Sin resultado</span></div>

    <div id="pendientes" class="pendientes" style="display:none"></div>

    <div id="listaJugadores"><div class="msg">Cargando clasificación en tiempo real...</div></div>

    <a class="btn-volver" href="index.html">⬅ Volver a inicio</a>
  </div>

  <script>
    const API_URL = "/api";

    const norm = v => (v === null || v === undefined) ? "" : String(v).trim().toUpperCase();
    const clave = v => norm(v).toLowerCase();
    const normPleno = v => norm(v).replace(/\s/g, "");                 // "2 - 1" -> "2-1"
    const esResultado = v => v === "1" || v === "X" || v === "2";
    const esPleno = v => /^[0-2M]-[0-2M]$/.test(v);
    const equipo = t => String(t == null ? "" : t).replace(/\s*\(.*$/, "").trim();   // quita "(M) (15º)"

    function el(tag, cls, txt) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (txt !== undefined) e.textContent = txt;
      return e;
    }

    // Estado de cada uno de los 14 partidos para un jugador: "ok" | "fail" | "pend"
    function evaluar(fila, partidos) {
      const est = {}; let ok = 0, fail = 0, pend = 0;
      for (let i = 1; i <= 14; i++) {
        const p = partidos[i];
        if (!p) continue;
        const res = norm(p[3]);
        if (!esResultado(res)) { est[i] = "pend"; pend++; }
        else if (norm(fila[i]) === res) { est[i] = "ok"; ok++; }
        else { est[i] = "fail"; fail++; }
      }
      return { est, ok, fail, pend };
    }

    // Partidos de la quiniela (los 14) que todavía no tienen resultado. El pleno al 15 no cuenta.
    function partidosPendientes(partidos) {
      let pend = 0, total = 0;
      for (let i = 1; i <= 14; i++) {
        if (!partidos[i]) continue;
        total++; if (!esResultado(norm(partidos[i][3]))) pend++;
      }
      return { pend, total };
    }

    function pintarPendientes(partidos) {
      const box = document.getElementById("pendientes");
      const { pend, total } = partidosPendientes(partidos);
      if (!total) { box.style.display = "none"; return; }
      box.style.display = "block";
      box.classList.toggle("fin", pend === 0);
      box.textContent = pend === 0
        ? "Jornada terminada: los " + total + " partidos tienen resultado"
        : (pend === 1 ? "Queda 1 de " + total + " partidos por terminar o disputarse"
                      : "Quedan " + pend + " de " + total + " partidos por terminar o disputarse");
    }

    // Una fila de la quiniela: línea con el partido + línea con [apuesta | resultado]
    function filaPartido(tbody, etiqueta, nombrePartido, apuesta, resultado, estado) {
      const t1 = el("tr", "partido");
      const c = el("td"); c.colSpan = 2;
      c.appendChild(el("b", "", etiqueta));
      c.appendChild(document.createTextNode(nombrePartido));
      t1.appendChild(c);
      const t2 = el("tr", "celdas " + estado);
      t2.appendChild(el("td", "", apuesta || "—"));
      t2.appendChild(el("td", "", resultado || "—"));
      tbody.append(t1, t2);
    }

    function construirBoleto(fila, partidos) {
      const caja = el("div", "boleto");
      if (!fila) { caja.appendChild(el("div", "vacio", "Este jugador todavía no tiene quiniela enviada.")); return caja; }

      const tabla = el("table");
      const thead = el("thead"), trh = el("tr");
      trh.append(el("th", "", "Su apuesta"), el("th", "", "Resultado"));
      thead.appendChild(trh); tabla.appendChild(thead);
      const tbody = el("tbody"); tabla.appendChild(tbody);

      const ev = evaluar(fila, partidos);
      const { ok, fail, pend } = ev;
      for (let i = 1; i <= 14; i++) {
        const p = partidos[i];
        if (!p) continue;
        const apuesta = norm(fila[i]);
        const res = norm(p[3]);
        const estado = ev.est[i];
        filaPartido(tbody, String(p[0] || i), equipo(p[1]) + " – " + equipo(p[2]), apuesta, esResultado(res) ? res : "", estado);
      }

      // Pleno al 15: solo lo rellena el jugador especial de la semana
      const apuesta15 = normPleno(fila[15]);
      const p15 = partidos[15];
      if (apuesta15 && p15) {
        const res15 = normPleno(p15[3]);
        let estado = "pend";
        if (esPleno(res15)) estado = (apuesta15 === res15) ? "ok" : "fail";
        const t0 = el("tr", "partido pleno-tit"); const c0 = el("td", "", "🔥 PLENO AL 15 · " + equipo(p15[1]) + " – " + equipo(p15[2])); c0.colSpan = 2;
        t0.appendChild(c0); tbody.appendChild(t0);
        const t2 = el("tr", "celdas " + estado);
        t2.append(el("td", "", apuesta15), el("td", "", esPleno(res15) ? res15 : "—"));
        tbody.appendChild(t2);
      }

      caja.appendChild(tabla);
      const resumen = el("div", "resumen");
      resumen.append(el("span", "v", ok + " acertados"), el("span", "r", fail + " fallados"), el("span", "p", pend + " sin resultado"));
      caja.appendChild(resumen);
      return caja;
    }

    async function cargarClasificacion() {
      const cont = document.getElementById("listaJugadores");
      try {
        const res = await fetch(API_URL + "?t=" + Date.now(), { cache: "no-store" });
        const data = await res.json();
        const lista = data.clasificacion;
        const pronos = data.pronosticos || [];
        const partidos = data.partidos || [];
        cont.innerHTML = "";

        if (!lista || lista.length <= 1) {
          cont.appendChild(el("div", "msg", "No hay datos disponibles en el Excel"));
          return;
        }

        pintarPendientes(partidos);

        // Pronósticos de cada jugador, buscados por nombre
        const porNombre = {};
        pronos.slice(1).forEach(f => { if (clave(f[0])) porNombre[clave(f[0])] = f; });

        lista.slice(1).forEach(fila => {
          const nombre = fila[0];
          if (!nombre || nombre.toString().trim() === "") return;

          const det = el("details", "jugador");
          const sum = el("summary");
          sum.appendChild(el("span", "flecha", "▶"));
          sum.appendChild(el("span", "nombre", nombre));
          const ev = porNombre[clave(nombre)] ? evaluar(porNombre[clave(nombre)], partidos) : null;
          const marcador = el("span", "marcador");
          const ac = el("span", "cifra ac", ev ? String(ev.ok) : "—");
          ac.appendChild(el("small", "", ev && ev.ok === 1 ? "acierto" : "aciertos"));
          const fa = el("span", "cifra fa", ev ? String(ev.fail) : "—");
          fa.appendChild(el("small", "", ev && ev.fail === 1 ? "fallo" : "fallos"));
          marcador.append(ac, fa);
          sum.appendChild(marcador);
          det.appendChild(sum);

          // El boleto se construye al abrir (más ligero y siempre con lo último cargado)
          det.addEventListener("toggle", () => {
            if (det.open && !det.querySelector(".boleto")) det.appendChild(construirBoleto(porNombre[clave(nombre)], partidos));
          });
          cont.appendChild(det);
        });
      } catch (error) {
        console.error("Error:", error);
        cont.innerHTML = "";
        cont.appendChild(el("div", "msg", "Error de conexión. Revisa la consola."));
      }
    }
    cargarClasificacion();
  </script>
</body>
</html>
