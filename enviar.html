<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0077cc" />
  <title>Tu Quiniela</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --card2: #f8fbff;
      --glass: rgba(255,255,255,.88);
      --text: #333333;
      --navy: #003366;
      --muted: #6b7785;
      --line: #dbe6f1;
      --primary: #0077cc;
      --primary-dark: #005fa3;
      --ok: #218838;
      --warn: #eab000;
      --bad: #c82333;
      --shadow: 0 10px 30px rgba(0, 60, 120, 0.10);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1722;
        --card: #182233;
        --card2: #1d2a3f;
        --glass: rgba(24,34,51,.88);
        --text: #eef3f9;
        --navy: #cfe3ff;
        --muted: #9db0c4;
        --line: #2a3a52;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
    }

    .bg-symbols { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .bg-symbols span {
      position: absolute; bottom: -60px; font-weight: 800; color: var(--primary); opacity: .07;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp { to { transform: translateY(-120vh) rotate(25deg); } }

    .container {
      position: relative; z-index: 1;
      max-width: 620px; width: 100%;
      margin: 24px 16px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
    }

    /* ---------- Cabecera ---------- */
    .hero {
      position: relative; overflow: hidden;
      border-radius: 18px; padding: 26px 22px 20px;
      color: #fff; text-align: center;
      background: linear-gradient(135deg, #0077cc, #00a6d6, #1f5fbf);
      background-size: 220% 220%;
      animation: shimmer 10s ease infinite, rise .7s ease both;
      box-shadow: var(--shadow);
    }
    @keyframes shimmer { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    .hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: rgba(255,255,255,.10); }
    .ball { display: inline-block; font-size: 42px; animation: bounce 1.6s cubic-bezier(.3,.8,.4,1) infinite; transform-origin: bottom center; }
    @keyframes bounce {
      0%,100% { transform: translateY(0) rotate(0); }
      45% { transform: translateY(-16px) rotate(180deg); }
      60% { transform: translateY(0) rotate(240deg) scale(1.08,.92); }
    }
    .hero h1 { margin: 6px 0 4px; font-size: 28px; letter-spacing: .4px; }
    .hero p { margin: 0; font-size: 14px; opacity: .93; }
    .pill {
      display: inline-block; margin-top: 14px; padding: 8px 14px;
      border-radius: 999px; background: rgba(255,255,255,.18); backdrop-filter: blur(4px);
      font-size: 13px; font-variant-numeric: tabular-nums;
    }

    .btn-back {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; margin: 16px 0 0; padding: 12px;
      border: 2px solid var(--primary); border-radius: 12px;
      background: var(--card); color: var(--primary);
      font-size: 16px; font-weight: 700; cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform .18s, background .2s, color .2s;
    }
    .btn-back:hover { background: var(--primary); color: #fff; transform: translateY(-2px); }
    .btn-back:active { transform: scale(.98); }

    /* ---------- Progreso ---------- */
    .progress {
      position: sticky; top: 8px; z-index: 10;
      margin: 16px 0; padding: 10px 14px;
      border-radius: 14px; background: var(--glass);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      box-shadow: var(--shadow);
    }
    .progress .top { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; color: var(--navy); }
    .progress .track { height: 8px; margin-top: 8px; border-radius: 6px; background: var(--line); overflow: hidden; }
    .progress .fill { height: 100%; width: 0; border-radius: 6px; background: linear-gradient(90deg, #0077cc, #00a6d6); transition: width .45s cubic-bezier(.2,.8,.2,1); }
    .progress.complete .fill { background: linear-gradient(90deg, #218838, #34c759); }

    /* ---------- Bloques ---------- */
    .name-card, .match-card {
      scroll-margin-top: 90px;
      background: var(--card);
      border: 2px solid transparent;
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .name-card { padding: 18px; margin-bottom: 18px; animation: rise .6s ease .2s both; }
    .field-label { display: block; margin-bottom: 8px; font-weight: 700; color: var(--navy); }

    select {
      width: 100%; padding: 12px;
      border: 2px solid var(--line); border-radius: 12px;
      background: var(--card2); color: var(--text);
      font-size: 16px; font-family: inherit;
    }
    select:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(0,119,204,.18); }

    /* ---------- Tarjeta de partido ---------- */
    #partidos { display: grid; gap: 18px; }
    .match-card { opacity: 0; transform: translateY(22px); transition: opacity .55s ease, transform .55s ease, border-color .3s; }
    .match-card.in { opacity: 1; transform: none; }
    .match-card.done { border-color: var(--ok); }

    .match-header {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px; color: #fff;
      background: linear-gradient(135deg, #003366, #0056b3);
    }
    .num {
      flex: 0 0 auto; width: 34px; height: 34px; display: grid; place-items: center;
      border-radius: 50%; background: rgba(255,255,255,.18); font-weight: 800; font-size: 14px;
    }
    .teams {
      flex: 1; min-width: 0;
      display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center;
      text-align: center; font-weight: 700; font-size: 15px; overflow-wrap: anywhere;
    }
    .teams .vs { font-size: 11px; opacity: .7; font-weight: 600; text-transform: uppercase; }
    .check {
      flex: 0 0 auto; width: 26px; height: 26px; display: grid; place-items: center;
      border-radius: 50%; background: #34c759; color: #fff; font-size: 14px; font-weight: 800;
      transform: scale(0); transition: transform .35s cubic-bezier(.3,1.6,.5,1);
    }
    .match-card.done .check { transform: scale(1); }

    .match-body { padding: 16px; }

    .prob-box { display: flex; gap: 8px; }
    .prob-item {
      flex: 1; text-align: center; padding: 9px 4px; border-radius: 10px;
      color: #fff; font-size: 14px; font-weight: 900; text-shadow: 1px 1px 2px rgba(0,0,0,.35);
      transition: transform .2s;
    }
    .prob-1 { background: var(--ok); }
    .prob-x { background: var(--warn); color: #000; text-shadow: none; }
    .prob-2 { background: var(--bad); }
    .prob-item.fav { transform: translateY(-2px) scale(1.04); box-shadow: 0 6px 14px rgba(0,0,0,.22); }
    .prob-item.fav::after { content: " ★"; }

    .stack { display: flex; height: 7px; margin: 10px 0 14px; border-radius: 6px; overflow: hidden; background: var(--line); }
    .stack .seg { display: block; height: 100%; width: 0; transition: width 1s cubic-bezier(.2,.8,.2,1) .15s; }
    .match-card.in .stack .seg { width: var(--w); }
    .seg.s1 { background: var(--ok); } .seg.sx { background: var(--warn); } .seg.s2 { background: var(--bad); }

    .recomendacion {
      background: rgba(0,119,204,.10);
      border-left: 5px solid var(--primary);
      padding: 12px 14px; margin-bottom: 16px;
      font-size: 14px; color: var(--text); border-radius: 6px;
    }

    /* Selector 1 X 2 */
    .picks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .pick { position: relative; display: block; margin: 0; }
    .pick input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
    .pick span {
      display: grid; place-items: center; height: 54px;
      border: 2px solid var(--line); border-radius: 12px;
      background: var(--card2); color: var(--muted);
      font-size: 22px; font-weight: 800;
      transition: transform .18s, background .2s, color .2s, border-color .2s, box-shadow .2s;
    }
    .pick:hover span { transform: translateY(-2px); }
    .pick input:checked + span { color: #fff; transform: scale(1.05); box-shadow: 0 8px 18px rgba(0,0,0,.2); }
    .pick.p1 input:checked + span { background: var(--ok); border-color: var(--ok); }
    .pick.px input:checked + span { background: var(--warn); border-color: var(--warn); color: #000; }
    .pick.p2 input:checked + span { background: var(--bad); border-color: var(--bad); }
    .pick input:focus-visible + span { outline: 3px solid rgba(0,119,204,.45); outline-offset: 2px; }
    .pick input:disabled { cursor: not-allowed; }

    /* ---------- Pleno al 15 ---------- */
    #extra-match {
      display: none; margin-top: 18px; padding: 18px;
      background: linear-gradient(135deg, #fffcf0, #fff4c7);
      border: 3px solid #ffd700; border-radius: 16px; box-shadow: var(--shadow);
      animation: pop .5s cubic-bezier(.3,1.5,.5,1);
      scroll-margin-top: 90px;
    }
    #extra-match label { color: #856404; font-size: 1.1em; display: block; margin-bottom: 8px; }
    #extra-match select { border-color: #ffeeba; background: #fff; color: #333; }
    @keyframes pop { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: scale(1); } }

    /* ---------- Enviar ---------- */
    .btn-send {
      width: 100%; margin-top: 24px; padding: 16px;
      border: none; border-radius: 14px;
      background: linear-gradient(135deg, #0077cc, #0056b3); color: #fff;
      font-size: 18px; font-weight: 800; cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,86,179,.28);
      transition: transform .2s, box-shadow .2s, opacity .2s;
    }
    .btn-send:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(0,86,179,.35); }
    .btn-send:active { transform: scale(.98); }
    .btn-send:disabled { opacity: .7; cursor: wait; transform: none; }
    .btn-send.ready { animation: glow 1.8s ease-in-out infinite; }
    @keyframes glow { 0%,100% { box-shadow: 0 8px 20px rgba(0,86,179,.28); } 50% { box-shadow: 0 0 0 8px rgba(0,119,204,.18), 0 12px 26px rgba(0,86,179,.4); } }
    .btn-send.cerrado { background: #6c757d; box-shadow: none; animation: none; cursor: not-allowed; opacity: .85; }

    /* ---------- Estados ---------- */
    .skeleton { height: 210px; border-radius: 16px; background: linear-gradient(90deg, var(--card) 25%, var(--line) 50%, var(--card) 75%); background-size: 200% 100%; animation: sk 1.3s linear infinite; box-shadow: var(--shadow); }
    @keyframes sk { to { background-position: -200% 0; } }
    .msg { text-align: center; padding: 26px 16px; background: var(--card); border-radius: 16px; box-shadow: var(--shadow); color: var(--muted); }
    .msg button { margin-top: 12px; padding: 10px 18px; border: none; border-radius: 10px; background: var(--primary); color: #fff; font-size: 15px; cursor: pointer; }
    .aviso-cierre { margin: 16px 0 0; border: 2px solid var(--bad); color: var(--text); }

    .shake { animation: shake .45s; border-color: var(--bad) !important; }
    @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }

    .toast {
      position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 50;
      transform: translate(-50%, 30px); opacity: 0;
      max-width: calc(100% - 32px); padding: 12px 18px; border-radius: 12px;
      background: #222; color: #fff; font-size: 15px; box-shadow: 0 10px 30px rgba(0,0,0,.35);
      transition: transform .3s, opacity .3s;
    }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }

    /* Éxito */
    .overlay {
      position: fixed; inset: 0; z-index: 60; display: grid; place-items: center;
      padding: 20px; background: rgba(0,20,50,.6); backdrop-filter: blur(4px);
      animation: fade .3s ease;
    }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .overlay .box {
      width: 100%; max-width: 360px; padding: 28px 22px; text-align: center;
      background: var(--card); border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,.4);
      animation: pop .5s cubic-bezier(.3,1.5,.5,1);
    }
    .overlay .big { font-size: 56px; display: inline-block; animation: bounce 1.2s ease infinite; }
    .overlay h2 { margin: 8px 0 4px; color: var(--navy); }
    .overlay p { margin: 0 0 18px; color: var(--muted); }
    .overlay .btn-send { margin-top: 0; }
    .confetti { position: fixed; top: -30px; font-size: 22px; z-index: 61; pointer-events: none; animation: fall linear forwards; }
    @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }

    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 380px) {
      .hero h1 { font-size: 25px; }
      .teams { font-size: 13px; }
      .pick span { height: 50px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      .match-card { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div class="bg-symbols" id="bgSymbols" aria-hidden="true"></div>

  <div class="container">
    <header class="hero">
      <div class="ball" aria-hidden="true">⚽</div>
      <h1>Tu Quiniela</h1>
      <p>Elige tu 1, X o 2 en cada partido</p>
      <div class="pill">⏳ <span id="cdTxt">calculando…</span></div>
    </header>

    <button type="button" id="btnVolver" class="btn-back"><span>⬅</span> Volver</button>

    <div class="msg aviso-cierre" id="avisoCierre" style="display:none">
      🔒 <b>La quiniela está cerrada.</b><br>Se abrirá en la próxima jornada.
    </div>

    <div class="progress" id="progress" aria-live="polite">
      <div class="top"><span id="progTxt">Elige tu nombre</span><span id="progPct">0%</span></div>
      <div class="track"><div class="fill" id="progFill"></div></div>
    </div>

    <form id="quinielaForm">
      <div class="name-card">
        <label class="field-label" for="nombre">👤 Selecciona tu nombre:</label>
        <select id="nombre" name="nombre" required>
          <option value="">Cargando nombres...</option>
        </select>
      </div>

      <div id="partidos">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
      </div>

      <div id="extra-match">
        <label id="labelP15"></label>
        <select name="p15" id="p15"></select>
      </div>

      <button type="submit" id="btnEnviar" class="btn-send">🚀 Enviar Pronóstico</button>
    </form>
  </div>

  <script>
    const API_URL = "/api";
    let USUARIO_ESPECIAL = "";
    let DATOS = null;

    // Estado de la jornada (lo decide el servidor)
    let CIERRE = null, DESFASE = 0, CERRADA = false;

    const $ = id => document.getElementById(id);
    const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // Bloquea / desbloquea el formulario
    function bloquear(lock) {
      CERRADA = lock;
      document.querySelectorAll("#quinielaForm select, #quinielaForm input").forEach(el => { el.disabled = lock; });
      const btn = $("btnEnviar");
      btn.disabled = lock;
      btn.classList.toggle("cerrado", lock);
      btn.innerText = lock ? "🔒 Quiniela cerrada" : "🚀 Enviar Pronóstico";
      $("avisoCierre").style.display = lock ? "block" : "none";
      if (lock) $("cdTxt").textContent = "🍀 ¡La suerte está echada!!";
    }

    /* ---------- Fondo flotante ---------- */
    (function () {
      var box = $("bgSymbols"), syms = ['1', 'X', '2'];
      for (var i = 0; i < 14; i++) {
        var s = document.createElement('span');
        s.textContent = syms[i % 3];
        s.style.left = Math.random() * 100 + '%';
        s.style.fontSize = (24 + Math.random() * 46) + 'px';
        s.style.animationDuration = (14 + Math.random() * 18) + 's';
        s.style.animationDelay = (-Math.random() * 20) + 's';
        box.appendChild(s);
      }
    })();

    /* ---------- Cuenta atrás ----------
       Abrir y cerrar es manual (panel admin). Con la quiniela abierta cuenta hasta el viernes 20:00;
       al llegar a 0 NO se bloquea nada: solo se cierra con el botón del admin. */
    (function () {
      var DIA = 6, HORA = 12, MIN = 0;   // inicio de la jornada (0=domingo ... 6=sábado)
      var AVISO_HORAS = 16;
      function proxima() {
        var n = new Date(), t = new Date(n);
        t.setHours(HORA, MIN, 0, 0);
        t.setDate(n.getDate() + (DIA - n.getDay() + 7) % 7);
        var aviso = new Date(t.getTime() - AVISO_HORAS * 3600 * 1000);
        while (aviso <= n) aviso = new Date(aviso.getTime() + 7 * 86400 * 1000);
        return aviso;
      }
      var objetivo = proxima();
      function pad(n) { return String(n).padStart(2, '0'); }
      function texto(ms) {
        var s = Math.floor(ms / 1000);
        return "Quedan " + Math.floor(s / 86400) + "d " + pad(Math.floor(s % 86400 / 3600)) + "h " +
          pad(Math.floor(s % 3600 / 60)) + "m " + pad(s % 60) + "s para echar la quiniela";
      }
      function tick() {
        if (CERRADA) return;
        if (CIERRE) {
          var ms = CIERRE - (Date.now() + DESFASE);
          $("cdTxt").textContent = ms > 0 ? texto(ms) : "⏰ Plazo cumplido: la quiniela se cerrará en breve";
          return;
        }
        var ms2 = objetivo - new Date();
        if (ms2 <= 0) { objetivo = proxima(); ms2 = objetivo - new Date(); }
        $("cdTxt").textContent = texto(ms2);
      }
      tick(); setInterval(tick, 1000);
    })();

    /* ---------- Utilidades de datos ---------- */
    function formatPct(val) {
      if (!val || val === "-") return "0%";
      if (typeof val === 'number') return Math.round(val * 100) + "%";
      return val.toString().includes('%') ? val : val + "%";
    }
    function pctNum(val) {
      if (!val || val === "-") return 0;
      if (typeof val === 'number') return Math.round(val * 100);
      return parseFloat(String(val).replace(',', '.')) || 0;
    }

    // Pinta la lista de nombres (con ⭐ en el usuario especial) y muestra/oculta el pleno al 15
    function pintarNombres() {
      const selN = $("nombre");
      const actual = selN.value;
      selN.innerHTML = '<option value="">Elige tu nombre</option>';
      DATOS.pronosticos.slice(1).forEach(f => {
        if (f[0]) {
          const opt = document.createElement("option");
          opt.value = f[0];
          opt.textContent = (f[0] === USUARIO_ESPECIAL) ? f[0] + " ⭐" : f[0];
          selN.appendChild(opt);
        }
      });
      selN.value = actual;
      $("extra-match").style.display =
        (selN.value && selN.value === USUARIO_ESPECIAL) ? "block" : "none";
      actualizarProgreso();
    }

    /* ---------- Progreso ---------- */
    function actualizarProgreso() {
      const cards = document.querySelectorAll(".match-card");
      if (!cards.length) return;
      let total = cards.length;
      let hechos = document.querySelectorAll(".match-card.done").length;
      if ($("extra-match").style.display === "block") {
        total += 1;
        if ($("p15").value) hechos += 1;
      }
      const pct = Math.round(hechos / total * 100);
      const completo = hechos === total;
      const hayNombre = !!$("nombre").value;
      $("progFill").style.width = pct + "%";
      $("progPct").textContent = pct + "%";
      $("progress").classList.toggle("complete", completo);
      $("btnEnviar").classList.toggle("ready", completo && hayNombre && !CERRADA);
      $("progTxt").textContent = completo
        ? (hayNombre ? "¡Todo listo! Solo falta enviar 🚀" : "Casi: falta elegir tu nombre 👤")
        : (hechos + " de " + total + " apuestas");
    }

    /* ---------- Carga principal ---------- */
    const io = ('IntersectionObserver' in window)
      ? new IntersectionObserver(es => es.forEach(en => {
          if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); }
        }), { threshold: .12 })
      : null;

    async function inicializar() {
      $("partidos").innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
      try {
        const res = await fetch(API_URL, { cache: "no-store" });
        const data = await res.json();
        DATOS = data;
        USUARIO_ESPECIAL = data.usuarioEspecial;

        const divP = $("partidos");
        divP.innerHTML = "";

        data.partidos.slice(1, 15).forEach((p, i) => {
          const n = [pctNum(p[5]), pctNum(p[6]), pctNum(p[7])];
          const sum = n[0] + n[1] + n[2];
          const fav = sum > 0 ? n.indexOf(Math.max.apply(null, n)) : -1;
          const w = n.map(v => sum > 0 ? (v / sum * 100).toFixed(1) : 33.3);

          const card = document.createElement("div");
          card.className = "match-card";
          card.innerHTML = `
            <div class="match-header">
              <div class="num">${i + 1}</div>
              <div class="teams"><span>${esc(p[1])}</span><span class="vs">vs</span><span>${esc(p[2])}</span></div>
              <div class="check" aria-hidden="true">✓</div>
            </div>
            <div class="match-body">
              <div class="prob-box">
                <div class="prob-item prob-1${fav === 0 ? ' fav' : ''}">1: ${esc(formatPct(p[5]))}</div>
                <div class="prob-item prob-x${fav === 1 ? ' fav' : ''}">X: ${esc(formatPct(p[6]))}</div>
                <div class="prob-item prob-2${fav === 2 ? ' fav' : ''}">2: ${esc(formatPct(p[7]))}</div>
              </div>
              <div class="stack" aria-hidden="true">
                <i class="seg s1" style="--w:${w[0]}%"></i>
                <i class="seg sx" style="--w:${w[1]}%"></i>
                <i class="seg s2" style="--w:${w[2]}%"></i>
              </div>
              <div class="recomendacion">
                <b>🔍 Análisis IA:</b> ${esc(p[8] || "Sin datos de análisis")}
              </div>
              <span class="field-label">Tu apuesta:</span>
              <div class="picks" role="radiogroup" aria-label="Apuesta partido ${i + 1}">
                <label class="pick p1"><input type="radio" name="p${i + 1}" value="1" required><span>1</span></label>
                <label class="pick px"><input type="radio" name="p${i + 1}" value="X" required><span>X</span></label>
                <label class="pick p2"><input type="radio" name="p${i + 1}" value="2" required><span>2</span></label>
              </div>
            </div>
          `;
          divP.appendChild(card);
          if (io) io.observe(card); else card.classList.add("in");
        });

        pintarNombres();

        const d15 = data.datosPartido15 || {};
        $("labelP15").innerHTML = `<b>🔥 PLENO AL 15: ${esc(d15.local)} vs ${esc(d15.visitante)}</b>`;
        const p15 = $("p15");
        const scores = ["0", "1", "2", "M"];
        p15.innerHTML = '<option value="">Marcador exacto</option>';
        scores.forEach(l => scores.forEach(v => {
          let o = document.createElement("option"); o.value = l + "-" + v; o.textContent = l + " - " + v; p15.appendChild(o);
        }));

        // Estado de la jornada: abierta o cerrada según el servidor
        CIERRE = data.cierre || null;
        if (data.cierre) DESFASE = (data.ahora || Date.now()) - Date.now();
        bloquear(data.abierta === false);

        actualizarProgreso();
      } catch (e) {
        console.error(e);
        $("nombre").innerHTML = '<option>Error de carga</option>';
        $("partidos").innerHTML =
          '<div class="msg">No se han podido cargar los partidos 😕<br><button type="button" id="reintentar">Reintentar</button></div>';
        $("reintentar").addEventListener("click", inicializar);
      }
    }

    /* ---------- Eventos ---------- */
    $("nombre").addEventListener("change", function () {
      $("extra-match").style.display = (this.value && this.value === USUARIO_ESPECIAL) ? "block" : "none";
      actualizarProgreso();
    });

    $("p15").addEventListener("change", actualizarProgreso);

    // Al elegir 1/X/2: marca la tarjeta, actualiza el progreso y salta al siguiente partido
    $("partidos").addEventListener("change", function (e) {
      const r = e.target;
      if (!r.matches || !r.matches('input[type=radio]')) return;
      const card = r.closest(".match-card");
      const primera = !card.classList.contains("done");
      card.classList.add("done");
      actualizarProgreso();
      if (primera) {
        const sig = card.nextElementSibling;
        if (sig && sig.classList.contains("match-card") && !sig.classList.contains("done")) {
          setTimeout(() => sig.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "center" }), 380);
        }
      }
    });

    // Cuando el menú admin rota el usuario especial, se repinta la ⭐ sin recargar
    window.addEventListener("quiniela:especial", function (e) {
      if (!DATOS) return;
      USUARIO_ESPECIAL = e.detail.usuario;
      pintarNombres();
    });

    // Sacudida de las tarjetas que faltan por rellenar
    $("quinielaForm").addEventListener("invalid", function (e) {
      const box = e.target.closest(".match-card, .name-card");
      if (box) { box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake"); }
    }, true);

    /* ---------- Avisos y éxito ---------- */
    function toast(texto) {
      const t = document.createElement("div");
      t.className = "toast"; t.textContent = texto;
      document.body.appendChild(t);
      requestAnimationFrame(() => t.classList.add("show"));
      setTimeout(() => { t.classList.remove("show"); setTimeout(() => t.remove(), 350); }, 3500);
    }

    function mostrarExito() {
      const ov = document.createElement("div");
      ov.className = "overlay";
      ov.innerHTML = `
        <div class="box" role="dialog" aria-modal="true">
          <div class="big">🎉</div>
          <h2>¡Pronóstico enviado!</h2>
          <p>Mucha suerte, que se cumplan esos 15 aciertos.</p>
          <button type="button" class="btn-send ready" id="okExito">Aceptar</button>
        </div>`;
      document.body.appendChild(ov);
      if (!reduceMotion) {
        const emojis = ["⚽", "🏆", "🎉", "💰", "⭐"];
        for (let i = 0; i < 28; i++) {
          const c = document.createElement("span");
          c.className = "confetti";
          c.textContent = emojis[i % emojis.length];
          c.style.left = Math.random() * 100 + "vw";
          c.style.animationDuration = (2.2 + Math.random() * 2.2) + "s";
          c.style.animationDelay = (Math.random() * .8) + "s";
          document.body.appendChild(c);
          setTimeout(() => c.remove(), 6000);
        }
      }
      $("okExito").addEventListener("click", () => location.reload());
    }

    /* ---------- Envío ---------- */
    $("quinielaForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (CERRADA) { toast("🔒 La quiniela está cerrada."); return; }
      const btn = $("btnEnviar");
      btn.disabled = true;
      btn.innerText = "Guardando...";

      const formData = new FormData(e.target);
      const payload = Object.fromEntries(formData.entries());

      try {
        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
        const r = await res.json();
        if (r.resultado === "ok") {
          mostrarExito();
        } else if (r.resultado === "cerrado") {
          toast("🔒 La quiniela ya está cerrada.");
          bloquear(true);
        } else {
          throw new Error("Respuesta inesperada");
        }
      } catch (err) {
        toast("❌ Error al enviar. Inténtalo de nuevo.");
        if (!CERRADA) {
          btn.disabled = false;
          btn.innerText = "🚀 Enviar Pronóstico";
        }
      }
    });

    $("btnVolver").addEventListener("click", function () { location.href = "index.html"; });

    // Se entera sola cuando el admin abre o cierra la quiniela
    setInterval(async function () {
      try {
        const d = await (await fetch(API_URL + "?t=" + Date.now(), { cache: "no-store" })).json();
        CIERRE = d.cierre || null;
        if (d.cierre) DESFASE = (d.ahora || Date.now()) - Date.now();
        const cerrada = d.abierta === false;
        if (cerrada && !CERRADA) bloquear(true);
        else if (!cerrada && CERRADA) location.reload();   // se ha abierto: se recargan los partidos nuevos
      } catch (e) {}
    }, 30000);

    inicializar();
  </script>
  <script src="admin.js"></script>
</body>
</html>
