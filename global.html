<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clasificación general</title>
  <style>
    * { box-sizing: border-box; }
    :root { --k: 1; --w: 108px; --d: 58px; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; min-height: 100vh;
      display: flex; justify-content: center; align-items: flex-start; color: #003366;
      background: radial-gradient(900px 500px at 50% -10%, #ffffff 0%, transparent 60%),
                  radial-gradient(700px 500px at 100% 100%, #cfe3f8 0%, transparent 60%), #e6eff9;
    }
    /* ---------- Fondo: 1 X 2 dando vueltas ---------- */
    .fondo { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
    .fondo span { position: absolute; left: 0; top: 0; font-weight: 900; line-height: 1; user-select: none;
      animation: vuelta var(--t) linear var(--dl) infinite alternate; }
    @keyframes vuelta {
      from { transform: translate(var(--x0), var(--y0)) rotate(0deg); }
      to   { transform: translate(var(--x1), var(--y1)) rotate(var(--r)); }
    }
    .container {
      position: relative; z-index: 1; max-width: 620px; width: 100%; margin: 40px 20px; padding: 30px 24px 26px; border-radius: 22px;
      background: rgba(255,255,255,.78); border: 1px solid rgba(255,255,255,.95);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 24px 50px rgba(0,51,102,.18), inset 0 1px 0 #fff;
    }
    h1 { text-align: center; margin: 0; font-size: 1.6em; letter-spacing: 1px; text-transform: uppercase; color: #003366; text-shadow: 0 2px 12px rgba(0,119,204,.25); }
    .sub { text-align: center; color: #5b7fa6; font-size: 14px; margin: 6px 0 0; }
    .barra { height: 5px; border-radius: 3px; margin: 14px auto 0; max-width: 220px; background: linear-gradient(90deg, #ffd23f 0 33%, #c4cfdc 33% 66%, #d98a4e 66% 100%); box-shadow: 0 0 14px rgba(255,210,63,.5); }

    .aviso { text-align: center; margin: 22px auto; padding: 12px 14px; border-radius: 10px; background: #fff3cd; border: 1px solid #ffe08a; color: #7a5b00; font-weight: bold; font-size: 15px; }

    /* ---------- Podio 3D ---------- */
    .escena { perspective: 1100px; perspective-origin: 50% 35%; margin: 38px 0 0; padding-bottom: 38px; position: relative; }
    .podio { display: flex; justify-content: center; align-items: flex-end; gap: 30px; transform-style: preserve-3d; transform: rotateX(-13deg) rotateY(-20deg); }
    .suelo { position: absolute; left: 4%; right: 4%; bottom: 6px; height: 46px; border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(0,70,150,.28), rgba(0,70,150,0) 70%); filter: blur(6px); }
    .col { width: var(--w); text-align: center; transform-style: preserve-3d; animation: sube .9s cubic-bezier(.2,.9,.3,1.15) both; }
    .col.r1 { animation-delay: .35s; } .col.r2 { animation-delay: .1s; } .col.r3 { animation-delay: .22s; }
    @keyframes sube { from { opacity: 0; transform: translateY(60px); } to { opacity: 1; transform: none; } }

    .corona { font-size: 28px; line-height: 1; height: 32px; animation: flota 2.6s ease-in-out infinite; filter: drop-shadow(0 4px 8px rgba(255,210,63,.7)); }
    @keyframes flota { 50% { transform: translateY(-6px) rotate(4deg); } }
    .avatar { width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 6px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 22px; color: #fff; text-transform: uppercase; border: 3px solid; box-shadow: 0 10px 18px rgba(0,40,90,.3); transform: translateZ(30px); }
    .nombre { font-weight: 700; color: #003366; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; }
    .vict { font-size: 12px; color: #5b7fa6; margin-bottom: 10px; text-transform: uppercase; letter-spacing: .5px; }
    .vict b { display: block; font-size: 28px; line-height: 1.1; color: #003366; letter-spacing: 0; }

    .r1 .avatar { width: 68px; height: 68px; font-size: 27px; background: linear-gradient(135deg, #ffe066, #d4a800); border-color: #fff1a8; animation: brillo 2.4s ease-in-out infinite; }
    .r2 .avatar { background: linear-gradient(135deg, #a8b6c8, #6f7f94); border-color: #dfe7f0; }
    .r3 .avatar { background: linear-gradient(135deg, #d99a66, #9a5b2e); border-color: #f0c39c; }
    @keyframes brillo { 50% { box-shadow: 0 10px 18px rgba(0,40,90,.3), 0 0 30px rgba(255,200,40,.9); } }

    /* Cubo: 5 caras reales */
    .cubo { position: relative; width: var(--w); height: var(--h); transform-style: preserve-3d; }
    .cara { position: absolute; }
    .frente { inset: 0; transform: translateZ(calc(var(--d) / 2)); background: linear-gradient(var(--f1), var(--f2)); border-radius: 3px 3px 0 0;
      display: flex; flex-direction: column; align-items: center; padding-top: 12px; color: #fff; font-weight: 800; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }
    .der, .izq { top: 0; left: calc(50% - var(--d) / 2); width: var(--d); height: 100%; background: linear-gradient(var(--s1), var(--s2)); }
    .der { transform: rotateY(90deg) translateZ(calc(var(--w) / 2)); }
    .izq { transform: rotateY(-90deg) translateZ(calc(var(--w) / 2)); filter: brightness(.7); }
    .sup { left: 0; top: calc(50% - var(--d) / 2); width: 100%; height: var(--d); transform: rotateX(90deg) translateZ(calc(var(--h) / 2)); background: var(--t); }
    .medalla { font-size: 32px; line-height: 1; filter: drop-shadow(0 3px 4px rgba(0,0,0,.35)); }
    .pos { font-size: 26px; margin-top: 2px; text-shadow: 0 2px 4px rgba(0,0,0,.4); }

    .r1 .cubo { --h: calc(150px * var(--k)); --f1: #ffd84d; --f2: #c99a00; --s1: #b88a00; --s2: #7a5a00; --t: linear-gradient(135deg, #fff2a0, #ffd84d); }
    .r2 .cubo { --h: calc(112px * var(--k)); --f1: #d3dce8; --f2: #8191a6; --s1: #7384a0; --s2: #4a5a72; --t: linear-gradient(135deg, #f1f5fa, #cfd8e3); }
    .r3 .cubo { --h: calc(84px * var(--k)); --f1: #e5a876; --f2: #a8683a; --s1: #935a30; --s2: #5f3a1c; --t: linear-gradient(135deg, #f6cfa6, #e5a876); }

    /* ---------- Resto de jugadores ---------- */
    #resto { margin-top: 6px; display: grid; gap: 8px; }
    .fila { display: grid; grid-template-columns: 34px 1fr minmax(60px, 120px) 58px; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px;
      background: linear-gradient(180deg, #ffffff, #eef5fc); border: 1px solid #d3e3f4;
      box-shadow: 0 5px 0 #c3d7ec, 0 12px 18px rgba(0,51,102,.12); transition: transform .2s, box-shadow .2s; }
    .fila:hover { transform: translateY(-3px); box-shadow: 0 8px 0 #c3d7ec, 0 18px 24px rgba(0,51,102,.18); }
    .rango { width: 30px; height: 30px; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 13px;
      background: linear-gradient(135deg, #3aa0ff, #0b5fc0); box-shadow: 0 3px 0 #083d7d, inset 0 1px 0 rgba(255,255,255,.4); }
    .fila .n { font-weight: 600; color: #003366; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pista { height: 10px; background: #dbe7f4; border-radius: 6px; overflow: hidden; box-shadow: inset 0 2px 3px rgba(0,51,102,.25); }
    .pista i { display: block; height: 100%; background: linear-gradient(90deg, #2d9bff, #6fe0ff); border-radius: 6px; box-shadow: 0 0 8px rgba(45,155,255,.6); }
    .fila .v { text-align: right; font-weight: 800; color: #003366; white-space: nowrap; }

    .msg { text-align: center; padding: 30px; color: #555; }
    .back-link { display: inline-block; margin-top: 26px; text-decoration: none; color: #fff !important; padding: 11px 18px; border-radius: 10px; font-weight: 600;
      background: linear-gradient(180deg, #2d9bff, #0b5fc0); box-shadow: 0 5px 0 #083d7d, 0 12px 20px rgba(0,51,102,.25); transition: transform .15s, box-shadow .15s; }
    .back-link:hover { transform: translateY(-2px); box-shadow: 0 7px 0 #083d7d, 0 16px 24px rgba(0,51,102,.3); }
    .back-link:active { transform: translateY(4px); box-shadow: 0 1px 0 #083d7d; }
    .pie { text-align: center; }

    @media (prefers-reduced-motion: reduce) { .col, .corona, .r1 .avatar, .fondo span { animation: none; } }
    @media (max-width: 440px) {
      :root { --k: .8; --w: 84px; --d: 44px; }
      .container { margin: 16px 10px; padding: 22px 12px; }
      .podio { gap: 18px; transform: rotateX(-12deg) rotateY(-16deg); }
      .avatar { width: 46px; height: 46px; font-size: 18px; } .r1 .avatar { width: 56px; height: 56px; font-size: 22px; }
      .nombre { font-size: 13px; } .vict b { font-size: 22px; }
      .fila { grid-template-columns: 30px 1fr 50px; } .pista { display: none; }
    }
  </style>
</head>
<body>
  <script src="nav.js"></script>
  <div class="fondo" id="fondo" aria-hidden="true"></div>
  <div class="container">
    <h1>🏆 Clasificación general</h1>
    <p class="sub" id="sub">Cargando...</p>
    <div class="barra"></div>

    <div id="aviso" class="aviso" style="display:none"></div>
    <div class="escena" id="escena">
      <div id="podio" class="podio"></div>
      <div class="suelo"></div>
    </div>
    <div id="resto"></div>

    <div class="pie"><a class="back-link" href="index.html">← Volver a inicio</a></div>
  </div>

<script>
  const API_URL = "/api";

  function el(tag, cls, txt) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt !== undefined) e.textContent = txt;
    return e;
  }
  // Símbolos 1 X 2 flotando y girando por el fondo
  (function () {
    const fondo = document.getElementById("fondo");
    const simbolos = ["1", "X", "2"];
    const colores = ["0,119,204", "91,127,166", "0,51,102"];
    const rnd = (a, b) => a + Math.random() * (b - a);
    for (let i = 0; i < 24; i++) {
      const s = document.createElement("span");
      const k = i % 3;
      s.textContent = simbolos[k];
      s.style.fontSize = Math.round(rnd(30, 96)) + "px";
      s.style.color = "rgba(" + colores[k] + "," + rnd(0.10, 0.20).toFixed(2) + ")";
      s.style.setProperty("--x0", rnd(-5, 100).toFixed(0) + "vw");
      s.style.setProperty("--y0", rnd(-5, 100).toFixed(0) + "vh");
      s.style.setProperty("--x1", rnd(-5, 100).toFixed(0) + "vw");
      s.style.setProperty("--y1", rnd(-5, 100).toFixed(0) + "vh");
      s.style.setProperty("--r", (Math.random() < .5 ? -1 : 1) * Math.round(rnd(360, 1080)) + "deg");
      s.style.setProperty("--t", rnd(18, 42).toFixed(0) + "s");
      s.style.setProperty("--dl", "-" + rnd(0, 30).toFixed(0) + "s");
      fondo.appendChild(s);
    }
  })();

  const plural = n => n === 1 ? "victoria" : "victorias";

  async function cargar() {
    try {
      const res = await fetch(API_URL, { cache: "no-store" });
      const data = await res.json();

      // Victorias que pones en el panel admin; los jugadores que aún no tienen ninguna salen con 0
      const mapa = new Map();
      const esCabecera = n => n.toLowerCase() === "nombre";

      (data.global || data.Global || []).forEach(f => {
        const n = String(f[0] == null ? "" : f[0]).trim();
        if (n && !esCabecera(n)) mapa.set(n, Math.max(0, Number(f[1]) || 0));
      });
      (data.pronosticos || []).forEach(f => {
        const n = String(f[0] == null ? "" : f[0]).trim();
        if (n && !esCabecera(n) && !mapa.has(n)) mapa.set(n, 0);
      });

      const lista = [...mapa].map(([nombre, v]) => ({ nombre, v }))
        .sort((a, b) => b.v - a.v || a.nombre.localeCompare(b.nombre, "es"));
      if (!lista.length) { document.getElementById("sub").textContent = "Todavía no hay jugadores"; return; }

      // Posición con empates (dos con las mismas victorias comparten puesto)
      let r = 0;
      lista.forEach((j, i) => { if (i === 0 || j.v !== lista[i - 1].v) r = i + 1; j.rank = r; });
      const max = lista[0].v;

      document.getElementById("sub").textContent = "Quinielas ganadas en total";

      let enPodio = [];
      if (max === 0) {
        const aviso = document.getElementById("aviso");
        aviso.style.display = "block";
        aviso.textContent = "Todavía nadie ha ganado una quiniela";
      } else {
        enPodio = lista.slice(0, 3).filter(j => j.v > 0);
      }

      // Podio: 2º a la izquierda, 1º en el centro, 3º a la derecha
      const podio = document.getElementById("podio");
      const orden = [1, 0, 2].filter(i => enPodio[i]);
      orden.forEach(i => {
        const j = enPodio[i];
        const rango = Math.min(j.rank, 3);
        const col = el("div", "col r" + rango);
        col.appendChild(el("div", "corona", rango === 1 ? "👑" : ""));
        col.appendChild(el("div", "avatar", j.nombre.charAt(0) || "?"));
        const n = el("div", "nombre", j.nombre);
        n.title = j.nombre;
        col.appendChild(n);
        const v = el("div", "vict");
        v.appendChild(el("b", "", String(j.v)));
        v.appendChild(document.createTextNode(plural(j.v)));
        col.appendChild(v);

        const cubo = el("div", "cubo");
        const frente = el("div", "cara frente");
        frente.appendChild(el("div", "medalla", ["🥇", "🥈", "🥉"][rango - 1]));
        frente.appendChild(el("div", "pos", j.rank + "º"));
        cubo.appendChild(frente);
        cubo.appendChild(el("div", "cara der"));
        cubo.appendChild(el("div", "cara izq"));
        cubo.appendChild(el("div", "cara sup"));
        col.appendChild(cubo);
        podio.appendChild(col);
      });
      if (!enPodio.length) document.getElementById("escena").style.display = "none";

      // El resto de jugadores, con su número de victorias al lado
      const resto = document.getElementById("resto");
      lista.filter(j => !enPodio.includes(j)).forEach(j => {
        const f = el("div", "fila");
        f.appendChild(el("div", "rango", j.rank + "º"));
        f.appendChild(el("div", "n", j.nombre));
        const pista = el("div", "pista");
        const barra = el("i");
        barra.style.width = (max ? Math.round(j.v / max * 100) : 0) + "%";
        pista.appendChild(barra);
        f.appendChild(pista);
        f.appendChild(el("div", "v", j.v + " 🏆"));
        resto.appendChild(f);
      });
    } catch (e) {
      console.error("Error cargando la clasificación:", e);
      document.getElementById("sub").textContent = "";
      document.getElementById("resto").replaceChildren(el("div", "msg", "Error de conexión. Revisa la consola."));
    }
  }
  cargar();
</script>

</body>
</html>
